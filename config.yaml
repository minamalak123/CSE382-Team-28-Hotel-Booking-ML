project:
  name: "CSE382 Hotel Booking ML"
  dataset: "H2.csv"
  random_seed: 42

paths:
  raw_data: "data/raw/H2.csv"
  processed: "data/processed"
  artifacts: "artifacts"
  outputs: "outputs"
  reports: "reports"

data:
  expected_rows: 79330
  expected_columns: 31
  target_regression: "ADR"
  target_classification: "IsCanceled"
  max_valid_adr: 1000          # ADR above this is a data error (only one row: 5400)

validation:
  test_size: 0.20
  validation_size: 0.20
  cross_validation_folds: 5

features:
  rare_category_min_frequency: 0.005   # categories rarer than 0.5% of train rows are pooled

clustering:
  k_min: 2
  k_max: 10
  silhouette_sample_size: 10000
